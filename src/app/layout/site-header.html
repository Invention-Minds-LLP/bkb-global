<header class="masthead" [class.scrolled]="scrolled()">
  <div class="wrap masthead-row">
    <a class="logo" href="/" aria-label="BKG Global School, Sandur: home">
      <img src="images/bkg/logo.png" width="853" height="462" alt="BKG Global School, Sandur" />
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()" aria-controls="site-nav">
      <span class="visually-hidden">Menu</span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
        @if (menuOpen()) {
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        } @else {
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        }
      </svg>
    </button>

    <nav id="site-nav" class="nav" [class.open]="menuOpen()" aria-label="Main">
      <ul>
        @for (item of nav; track item.href) {
          <li><a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a></li>
        }
      </ul>
      <a class="btn btn-navy nav-cta" href="#admissions" (click)="closeMenu()">Admissions 2026–27</a>
    </nav>
  </div>
</header>
