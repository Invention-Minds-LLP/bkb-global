<section class="news" aria-labelledby="news-title">
  <div class="head">
    <h2 id="news-title">BKG happenings</h2>
    <a class="all" [href]="happeningsUrl">All happenings
      <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="M4 12h15M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
  </div>

  <div class="grid">
    <ul class="events">
      @for (e of events; track e.title) {
        <li>
          <a class="event" [href]="happeningsUrl">
            <div class="thumb" aria-hidden="true">
              <svg viewBox="0 0 120 90">
                @switch (e.art) {
                  @case ('trophy') {
                    <path d="M42 16h36v16c0 14-8 22-18 22s-18-8-18-22z" fill="#e5a823" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M42 22H30c0 12 6 16 14 16M78 22h12c0 12-6 16-14 16" fill="none" stroke="#0f1b44" stroke-width="2.5"/>
                    <path d="M60 54v12M46 78h28v-8H46z" fill="#1e3a8a" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                  }
                  @case ('diya') {
                    <path d="M60 14c8 10 9 18 4 24-3 3-5 4-4 4-6 0-11-5-9-12 1-6 6-9 9-16z" fill="#e5a823" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M28 50c8 20 56 20 64 0z" fill="#1e3a8a" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M24 50h72" stroke="#0f1b44" stroke-width="2.5" stroke-linecap="round"/>
                  }
                  @case ('cap') {
                    <path d="M38 46v16c0 8 44 8 44 0V46" fill="#1e3a8a" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M60 22 L100 38 L60 54 L20 38 Z" fill="#0f1b44" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                    <path d="M60 38 L88 46 V66" fill="none" stroke="#e5a823" stroke-width="3" stroke-linecap="round"/>
                  }
                  @case ('flag') {
                    <path d="M34 80V12" stroke="#0f1b44" stroke-width="3" stroke-linecap="round"/>
                    <path d="M36 14h52v14H36z" fill="#e5a823"/><path d="M36 28h52v14H36z" fill="#fff"/><path d="M36 42h52v14H36z" fill="#3a8a3e"/>
                    <circle cx="62" cy="35" r="5" fill="none" stroke="#1e3a8a" stroke-width="1.6"/>
                    <path d="M36 14h52v42H36z" fill="none" stroke="#0f1b44" stroke-width="2.5" stroke-linejoin="round"/>
                  }
                  @case ('flower') {
                    <g fill="#e5a823" stroke="#0f1b44" stroke-width="2">
                      <ellipse cx="60" cy="24" rx="9" ry="14"/><ellipse cx="60" cy="24" rx="9" ry="14" transform="rotate(60 60 42)"/>
                      <ellipse cx="60" cy="24" rx="9" ry="14" transform="rotate(120 60 42)"/><ellipse cx="60" cy="24" rx="9" ry="14" transform="rotate(180 60 42)"/>
                      <ellipse cx="60" cy="24" rx="9" ry="14" transform="rotate(240 60 42)"/><ellipse cx="60" cy="24" rx="9" ry="14" transform="rotate(300 60 42)"/>
                    </g>
                    <circle cx="60" cy="42" r="9" fill="#c8252c" stroke="#0f1b44" stroke-width="2"/>
                  }
                  @case ('flute') {
                    <path d="M18 70 L100 22" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round"/>
                    <path d="M18 70 L100 22" stroke="#0f1b44" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
                    <circle cx="48" cy="53" r="2.4" fill="#fff"/><circle cx="58" cy="47" r="2.4" fill="#fff"/><circle cx="68" cy="41" r="2.4" fill="#fff"/>
                    <path d="M86 50c6-10 16-12 20-8-6 2-10 8-12 14z" fill="#3a8a3e" stroke="#0f1b44" stroke-width="2" stroke-linejoin="round"/>
                    <circle cx="96" cy="44" r="4" fill="#e5a823" stroke="#0f1b44" stroke-width="1.6"/>
                  }
                }
              </svg>
            </div>
            <span class="tag" [class.recent]="e.when === 'Recent'">{{ e.when }}</span>
            <p class="title">{{ e.title }}</p>
          </a>
        </li>
      }
    </ul>

    <aside class="blog" aria-labelledby="blog-title">
      <h3 id="blog-title">
        <svg aria-hidden="true" viewBox="0 0 32 32" width="28" height="28">
          <path d="M6 5h16l4 4v18H6z" fill="#fff" stroke="#0f1b44" stroke-width="2" stroke-linejoin="round"/>
          <path d="M10 13h12M10 18h12M10 23h8" stroke="#1e3a8a" stroke-width="2" stroke-linecap="round"/>
        </svg>
        From the BKG blog
      </h3>
      <ul>
        @for (post of posts; track post.title) {
          <li><a [href]="blogUrl"><span class="post-date">{{ post.date }}</span>{{ post.title }}</a></li>
        }
      </ul>
      <a class="blog-all" [href]="blogUrl">Read the blog</a>
    </aside>
  </div>
</section>
